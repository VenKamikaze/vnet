name: CI

# Work branches (vnet/NN-*) are merged locally, so they need push builds. A
# pull request from the same repository would run twice (push + PR): the
# concurrency group below cancels the older run for the same ref.
on:
  push:
    branches: [main, claude, "vnet/**"]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}${{ matrix.sanitize && ' / asan+ubsan' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc,   cxx: g++,     sanitize: false }
          - { os: ubuntu-latest, cc: clang, cxx: clang++, sanitize: false }
          - { os: ubuntu-latest, cc: gcc,   cxx: g++,     sanitize: true }
          # Not verifiable from the authoring environment (no macOS there).
          - { os: macos-latest,  cc: clang, cxx: clang++, sanitize: false }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # The IPv6 UDP test must run on every job: a missing ::1 is a failure.
      VNET_REQUIRE_IPV6: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the FetchContent consumer check clones this checkout

      # The relay (Go) is built by CMake and tested by ctest (relay_go_tests and
      # the integration tests that start it).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: relay/go.sum

      - name: Make sure IPv6 loopback (::1) exists
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0 net.ipv6.conf.lo.disable_ipv6=0
          ip -6 addr show dev lo
          ip -6 addr show dev lo | grep -q 'inet6 ::1' || { echo "::1 missing on lo"; exit 1; }

      - name: Install GoogleTest (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev

      # macOS: tests fetch GoogleTest with FetchContent (git, not an archive).

      - name: Configure
        run: |
          flags=""
          if [ "${{ matrix.sanitize }}" = "true" ]; then
            flags="-fsanitize=address,undefined -fno-sanitize-recover=undefined -g"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DVNET_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$flags"

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install and consume via find_package
        if: matrix.sanitize == false
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/vnet-prefix"
          cmake -S tests/consumer -B "$RUNNER_TEMP/consumer-build" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/vnet-prefix"
          cmake --build "$RUNNER_TEMP/consumer-build"
          "$RUNNER_TEMP/consumer-build/consumer"

      - name: Consume via FetchContent (GIT_REPOSITORY)
        if: matrix.sanitize == false
        run: |
          cmake -S tests/consumer_fetch -B "$RUNNER_TEMP/fetch-build" \
            -DVNET_REPO="file://$GITHUB_WORKSPACE" -DVNET_REV="$(git rev-parse HEAD)"
          cmake --build "$RUNNER_TEMP/fetch-build"
          "$RUNNER_TEMP/fetch-build/consumer"

  relay:
    name: relay (Go) / vet, race tests, Docker image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: relay/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Tests under the race detector
        run: go test -race -count=1 ./...
      - name: Fuzz targets (30 s each)
        run: |
          go test -run XXX -fuzz FuzzHandleUDP -fuzztime 30s .
          go test -run XXX -fuzz FuzzHandleWS -fuzztime 30s .
          go test -run XXX -fuzz FuzzHandleWT -fuzztime 30s .
      - name: Build the Docker image
        run: docker build -t vnet-relay .
      - name: Run the container and talk to it
        run: |
          docker run -d --name relay -p 127.0.0.1:7777:7777/udp -p 127.0.0.1:8080:8080 -p 127.0.0.1:4433:4433/udp vnet-relay -wt :4433 -dev-cert
          for i in $(seq 50); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 0.2; done
          # (/stats is off by default since the brief 10 fix round: check the start-up line instead)
          docker logs relay 2>&1 | grep -E '^LISTEN udp=.* wt=\[::\]:4433 wt_cert_sha256=[0-9a-f]{64}$'
          docker rm -f relay

  browser:
    name: browser (Emscripten + Chromium via Playwright): WebSocket, WebTransport, fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: relay/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: .emsdk
          key: emsdk-${{ hashFiles('scripts/setup-emsdk.sh') }}
      - name: Install the pinned emsdk
        run: scripts/setup-emsdk.sh
      - name: Install Playwright and Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Build everything and run the browser test
        run: scripts/test-browser.sh "$RUNNER_TEMP/browser"

  mingw:
    name: MinGW-w64 cross build (smoke and relay under Wine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: relay/go.sum
      - name: Install toolchain and Wine
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 wine64
      - name: Configure and build
        run: |
          cmake -S . -B build-mingw \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DVNET_BUILD_TESTS=OFF -DVNET_BUILD_SMOKE=ON \
            -DVNET_WARNINGS_AS_ERRORS=ON
          cmake --build build-mingw
      - name: Run smoke test under Wine
        run: |
          WINE=$(command -v wine64 || command -v wine || echo /usr/lib/wine/wine64)
          WINEDEBUG=-all "$WINE" build-mingw/tests/vnet_smoke.exe
      - name: Windows relay_peer.exe against the Go relay (both directions)
        run: scripts/test-mingw-relay.sh "$RUNNER_TEMP/mingw-relay"
